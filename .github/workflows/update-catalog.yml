name: Atualizar catálogo DCGames

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

concurrency:
  group: dcgames-catalog
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Coletar e validar
        run: python scripts/update_catalog.py
      - name: Publicar apenas quando houver alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: atualizar catálogo de jogos"
            git push
          fi
